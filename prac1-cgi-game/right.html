<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Correct!</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #1a1a1a;
            font-family: 'Press Start 2P', cursive;
            color: #fff;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        
        .message {
            font-size: 32px;
            margin-top: 150px;
            padding: 30px;
            color: #4caf50;
            text-shadow: 4px 4px 0 #2e7d32;
        }
        
        a {
            display: inline-block;
            margin-top: 50px;
            padding: 15px 30px;
            background-color: #2196F3;
            color: white;
            text-decoration: none;
            font-size: 18px;
            border: 4px solid #1976D2;
            box-shadow: 0 8px 0 #0D47A1, 0 10px 10px rgba(0, 0, 0, 0.5);
            transition: all 0.1s ease;
        }
        
        a:hover {
            background-color: #42A5F5;
            transform: translateY(4px);
            box-shadow: 0 4px 0 #0D47A1, 0 8px 8px rgba(0, 0, 0, 0.5);
        }
        
        a:active {
            transform: translateY(8px);
            box-shadow: 0 0 0 #0D47A1, 0 5px 5px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>

<body>
    <div class="message">CORRECT! WELL DONE.</div>
    <a href="/cgi-bin/game.cgi">PLAY AGAIN</a>
</body>

</html>
